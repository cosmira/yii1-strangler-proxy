name: ShellCheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shellcheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Download ShellCheck 0.11.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.11.0 --repo koalaman/shellcheck \
            --pattern shellcheck-v0.11.0.linux.x86_64.tar.xz --dir "$RUNNER_TEMP"
          tar -xJf "$RUNNER_TEMP/shellcheck-v0.11.0.linux.x86_64.tar.xz" -C "$RUNNER_TEMP"

      - name: Check shell scripts
        run: |
          "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" --version
          git ls-files -z -- '*.sh' | xargs -0 -r "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck"
