name: Spelling

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: typos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Download typos 1.50.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/typos"
          gh release download v1.50.0 --repo crate-ci/typos \
            --pattern typos-v1.50.0-x86_64-unknown-linux-musl.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/typos-v1.50.0-x86_64-unknown-linux-musl.tar.gz" -C "$RUNNER_TEMP/typos"

      - name: Check spelling
        run: |
          "$RUNNER_TEMP/typos/typos" --config .github/typos.toml
