name: Quality Assurance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      file-size-mib:
        description: 'File size in MiB for both directions; empty uses the small suite'
        required: false
        default: ''
      file-rounds:
        description: 'Measured runs per direction (each worker also warms up once)'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Published catalog example
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CATALOG_REQUIRE_NODE: '1'
      STRANGLER_TOKEN: ci-example-token
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, dom, fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check configuration without contacting backend
        run: php examples/catalog/check.php

      - name: Verify published HTTP and JavaScript contracts
        run: composer example:verify

      - name: Verify file transfers and record measurements
        env:
          FILE_SIZE_MIB: ${{ inputs.file-size-mib }}
          FILE_ROUNDS: ${{ inputs.file-rounds }}
        run: |
          mkdir -p build
          if [ -n "$FILE_SIZE_MIB" ]; then
            composer benchmark:files -- --size-mib="$FILE_SIZE_MIB" --rounds="$FILE_ROUNDS" > build/files-benchmark.json
          else
            composer benchmark:files > build/files-benchmark.json
          fi

      - name: Upload file measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: files-benchmark
          path: build/files-benchmark.json
          if-no-files-found: warn

  composer:
    name: Composer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Validate package metadata
        run: composer validate --strict --no-check-lock

  phpstan:
    name: PHPStan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        id: php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ steps.php.outputs.php-version }}-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: composer test:types -- --no-progress

  rector:
    name: Rector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        id: php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ steps.php.outputs.php-version }}-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Rector
        run: composer test:rector

  soda:
    name: Soda
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check source and PHPDoc contracts
        run: composer test:soda
